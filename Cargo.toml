[workspace]
members = [
    "baseline",
    "baseline-simple",
    "cache-prefix-simple",
    "static-alloc-prefix-simple",
    "adaptive-buffer-simple",
]
resolver = "3"

# benchmark 与 release 统一使用 O2 + 单 codegen unit + LTO，
# 保证被比较的两个实现处在同一编译设置下。
[profile.release]
opt-level = 2
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

[package]
name = "logger-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
